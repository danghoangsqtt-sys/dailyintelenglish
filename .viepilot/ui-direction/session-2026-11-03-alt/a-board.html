<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng A · Bảng sản xuất</title><link rel="stylesheet" href="base.css">
<style>
/* Direction A: the whole studio is one production board (like Trello / Notion boards), Lina lives in a chat panel on the right */
body { background: #eef1ee; color: #14201a; display: grid; grid-template-rows: 64px 58px minmax(0, 1fr); height: 100vh; overflow: hidden; }
header { display: flex; align-items: center; gap: 26px; padding: 0 22px; background: #0f4d2a; color: #fff; }
header .brand { display: flex; align-items: center; gap: 10px; font: 800 18px "Montserrat"; }
header .brand img { width: 36px; height: 36px; border-radius: 50%; }
header nav { display: flex; gap: 4px; }
header nav a { padding: 9px 16px; border-radius: 10px; font-weight: 600; color: #cfe6d6; }
header nav a[aria-current="page"] { background: rgba(255, 255, 255, .14); color: #fff; }
header .search { margin-left: auto; width: 360px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, .12); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #b9d8c3; }
header .new { height: 42px; padding: 0 18px; border-radius: 10px; background: #ffd60a; color: #2f2600; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #fff; border-bottom: 1px solid #dfe5df; }
.bar b { font: 800 20px "Montserrat"; margin-right: 10px; }
.bar .f { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #d3dad3; display: flex; align-items: center; font-weight: 600; font-size: 15px; color: #3d4a41; }
.bar .f.on { background: #14201a; color: #fff; border-color: #14201a; }
main { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 340px; gap: 14px; padding: 14px 14px 0 22px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; background: #e3e8e3; border-radius: 14px; }
.col h2 { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; font-size: 16px; font-weight: 800; }
.col h2 small { margin-left: auto; background: #fff; border-radius: 11px; padding: 1px 9px; font-size: 13px; color: #56635a; }
.col h2 i { width: 10px; height: 10px; border-radius: 3px; }
.col.wait { background: #fff4c7; }
.cards { overflow: auto; padding: 0 10px 14px; display: grid; gap: 10px; align-content: start; }
.card { background: #fff; border-radius: 12px; padding: 10px; display: flex; gap: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.card .th { width: 58px; }
.card b { display: block; font-size: 15.5px; line-height: 1.3; }
.card span { display: block; font-size: 13.5px; color: #6c776f; margin-top: 3px; }
.card .p { height: 6px; border-radius: 3px; background: #e7ece7; margin-top: 8px; overflow: hidden; }
.card .p i { display: block; height: 100%; background: #1d7a3a; }
.card .acts { display: flex; gap: 6px; margin-top: 8px; }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #d3dad3; background: #fff; font: 600 14px "Inter"; display: inline-flex; align-items: center; }
.btn.g { background: #1d7a3a; border-color: #1d7a3a; color: #fff; }
.add { border: 2px dashed #c5cec6; border-radius: 12px; padding: 12px; text-align: center; color: #66726a; font-weight: 600; }
.lina { display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 14px 14px 0 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); overflow: hidden; }
.lina h2 { padding: 14px 16px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #e6ebe6; display: flex; align-items: center; gap: 8px; }
.lina h2 i { width: 9px; height: 9px; border-radius: 50%; background: #2fa557; }
.msgs { flex: 1; overflow: auto; padding: 14px; display: grid; gap: 10px; align-content: start; }
.m { background: #f1f4f1; border-radius: 4px 14px 14px 14px; padding: 10px 12px; font-size: 15px; }
.m .acts { margin-top: 8px; display: flex; gap: 6px; }
.me { background: #1d7a3a; color: #fff; border-radius: 14px 4px 14px 14px; justify-self: end; }
.lina .stage { height: 250px; background: linear-gradient(180deg, #fff, #e9f3ec); position: relative; }
.lina .stage img { position: absolute; left: 50%; bottom: 0; height: 100%; transform: translateX(-50%); }
.lina .ask { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e6ebe6; }
.lina .ask div { flex: 1; height: 40px; border-radius: 10px; background: #f1f4f1; display: flex; align-items: center; padding: 0 12px; color: #7a857d; font-size: 15px; }
</style></head>
<body>
<header>
  <a class="brand" href="#"><img src="../../../frontend/static/brand/logo-64.png" alt="">Daily Beyond English</a>
  <nav><a href="#" aria-current="page">Bảng sản xuất</a><a href="#">Lịch đăng</a><a href="#">Thư viện</a><a href="#">Tự động</a><a href="#">Cài đặt</a></nav>
  <div class="search"><svg class="i"><use href="../session-2026-11-03-ia/icons.svg#search"/></svg>Tìm video, mẫu, nhân vật…</div>
  <a class="new" href="#"><svg class="i"><use href="../session-2026-11-03-ia/icons.svg#plus"/></svg>Tạo video</a>
</header>
<div class="bar"><b>Bảng sản xuất</b><span class="f on">Tất cả · 22</span><span class="f">Short</span><span class="f">Video dài</span><span class="f">Ngữ pháp bản chất</span><span class="f">Một gốc – cả họ từ</span><span class="f">The Office Startup</span></div>
<main id="board"></main>
<nav class="switch"><a href="a-board.html" aria-current="page">A · Bảng sản xuất</a><a href="b-studio.html">B · Studio tối</a><a href="c-bento.html">C · Ô gạch</a></nav>
<script>
// prototype only: the five stages of a video, as columns
const S = (img) => `../../../frontend/static/samples/${img}.jpg`;
const C = [
  ["Ý tưởng", "#9aa59d", "", [["wordday-vi", "Word: cozy", "Từ của ngày · Thứ Bảy"], ["grammar-vi", "Câu điều kiện loại 2", "Ngữ pháp · Tập 4"], ["roots-vi", "Gốc DICT", "Gốc từ · Tập 8"], ["quiz-vi", "Quiz giới từ", "Quiz"]], "+ Thêm ý tưởng"],
  ["Nội dung", "#2b6cb0", "", [["grammar-vi", "Hiện tại hoàn thành", "Kịch bản · AI đang viết", 40], ["news-vi", "Tin tuần 45", "Học liệu · 4 thẻ", 70]]],
  ["Sản xuất", "#7c3aed", "", [["mistakes-vi", "Lỗi \"I very like\"", "Dựng video · cảnh 5/6", 84], ["roots-vi", "Tiền tố RE-", "Giọng đọc · chờ đêm nay", 10]]],
  ["Chờ bạn duyệt", "#d99a00", "wait", [["grammar-vi", "Câu bị động: hiểu bản chất", "Ngữ pháp · 0:58", 0, ["Duyệt", "Xem"]], ["roots-vi", "Hậu tố -MENT", "Thiếu 3 hình minh họa", 0, ["Vẽ lại hình"]], ["news-vi", "Cities plant more trees", "AI đã sửa 1 câu", 0, ["Duyệt", "Xem"]]]],
  ["Đã lên lịch", "#1d7a3a", "", [["roots-vi", "Gốc SPECT", "Hôm nay 19:00"], ["conversation", "The Office · Tập 6", "Thứ Tư 20:00", 0, null, 1], ["chat-vi", "Planning a picnic", "Thứ Năm 19:00"], ["wordday-vi", "Word: cozy", "Thứ Bảy 09:00"]]],
];
document.getElementById("board").innerHTML = C.map(([t, color, cls, xs, add]) => `<section class="col ${cls}"><h2><i style="background:${color}"></i>${t}<small>${xs.length}</small></h2><div class="cards">
  ${xs.map(([img, n, s, p, acts, wide]) => `<div class="card"><div class="th${wide ? " w" : ""}" style="${wide ? "width:92px;align-self:start" : ""}"><img src="${S(img)}" alt=""></div><div class="grow"><b>${n}</b><span>${s}</span>
    ${p ? `<div class="p"><i style="width:${p}%"></i></div>` : ""}${acts ? `<div class="acts">${acts.map((a, i) => `<a class="btn${i ? "" : " g"}" href="#">${a}</a>`).join("")}</div>` : ""}</div></div>`).join("")}
  ${add ? `<div class="add">${add}</div>` : ""}</div></section>`).join("") + `
  <aside class="lina"><h2><i></i>Lina · trợ lý</h2>
    <div class="msgs">
      <div class="m">Chào buổi chiều! Đêm qua mình làm xong 3 video, cả 3 đang ở cột <b>Chờ bạn duyệt</b>.</div>
      <div class="m">Video "Hậu tố -MENT" thiếu 3 hình. Mình vẽ lại luôn nhé?<div class="acts"><a class="btn g" href="#">Vẽ lại</a><a class="btn" href="#">Để sau</a></div></div>
      <div class="m me">Đêm nay làm thêm 2 video ngữ pháp</div>
      <div class="m">Đã thêm "Hiện tại hoàn thành" và "Câu điều kiện loại 2" vào lịch Tự động 23:00.</div>
    </div>
    <div class="stage"><img src="../session-2026-11-03-ia/mascot/lina/front/gesture-talk.webp" alt="Lina"></div>
    <div class="ask"><div>Nhắn cho Lina…</div><a class="btn g" href="#">Gửi</a></div></aside>`;
</script></body></html>
