<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kênh · Daily Beyond English</title><link rel="stylesheet" href="style.css">
<style>
/* the week as lanes (Short / video dài), the channel's own publishing grid */
.lanes { display: grid; grid-template-columns: 120px repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--surface); overflow: hidden; }
.lanes > div { padding: 12px; border-left: 1px solid var(--line); min-height: 132px; display: grid; align-content: start; gap: 8px; }
.lanes > .lab { border-left: 0; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; background: var(--sunk); }
.lanes > .dh { min-height: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); font-weight: 700; color: var(--ink-3); font-size: 14px; }
.lanes > .dh b { font: 800 20px var(--display); color: var(--ink); margin-left: 4px; }
.lanes > .dh.today { color: var(--link); } .lanes > .dh.today b { color: var(--link); }
.lanes > .row1 { border-bottom: 1px solid var(--line); }
.ep { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px; border-radius: 10px; background: var(--sunk); font-size: 14px; font-weight: 600; line-height: 1.3; }
.ep .thumb { width: 30px; border-radius: 5px; }
.ep small { display: block; color: var(--ink-3); font-weight: 500; }
.ep.ok { background: var(--brand-tint); } .ep.wait { background: var(--wait-tint); } .ep.plan { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); } .ep.plan .thumb { opacity: .45; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-3); font-size: 14.5px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.series .row { grid-template-columns: 12px minmax(0, 1fr) 200px auto; }
.dot { width: 12px; height: 12px; border-radius: 4px; }
.bar { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--brand); border-radius: 5px; }
@media (max-width: 860px) { .series .row { grid-template-columns: 12px minmax(0, 1fr); } .series .row > :nth-child(3), .series .row > :nth-child(4) { grid-column: 2; } }
</style></head>
<body data-page="channel">
<main>
  <div class="head"><h1>Kênh</h1><span class="sub">Tuần 45 · 2–8 tháng 11</span>
    <span class="end"><a class="btn" href="#"><svg class="i" aria-hidden="true"><use href="../icons.svg#spark"/></svg>Lên kế hoạch cùng Lina</a><a class="btn primary" href="#">Series mới</a></span></div>
  <nav class="full tabs" aria-label="Kênh"><a href="#" aria-current="page">Lịch đăng</a><a href="#">Series <small>6</small></a><a href="#">Tự động <small>23:00</small></a></nav>

  <div class="full tip"><span class="face"><img src="../lina/front/calm__closed.webp" alt=""></span>
    <p>Thứ Sáu và Chủ nhật chưa có Short sẵn sàng. Đêm nay mình làm <b>Tiền tố RE-</b> cho Thứ Sáu nhé?</p><a class="btn sm primary" href="#">Làm đêm nay</a></div>

  <section class="full">
    <div class="sh"><h2>Tuần này</h2><div class="legend"><span><i style="background:var(--brand-tint);border:1px solid var(--brand)"></i>Sẵn sàng</span><span><i style="background:var(--wait-tint);border:1px solid var(--wait)"></i>Chờ bạn duyệt</span><span><i style="border:1px dashed var(--ink-3)"></i>Kế hoạch</span></div>
      <span class="more"><a class="btn sm ghost" href="#">Tuần trước</a> <a class="btn sm ghost" href="#">Tuần sau</a></span></div>
    <div class="scroll-x"><div class="lanes" id="lanes" style="min-width:980px"></div></div>
  </section>

  <section class="full series">
    <div class="sh"><h2>Series đang chạy</h2><a class="more" href="#">Tất cả 6</a></div>
    <div class="panel" id="series"></div>
  </section>
</main>
<script>
const S = (img) => `../../../../frontend/static/samples/${img}.jpg`;
const days = [["T2", 2], ["T3", 3, 1], ["T4", 4], ["T5", 5], ["T6", 6], ["T7", 7], ["CN", 8]];
const short = { 2: ["ok", "roots-vi", "Gốc PRESS", "đã đăng"], 3: ["ok", "roots-vi", "Gốc SPECT", "19:00"], 4: ["wait", "grammar-vi", "Câu bị động", "19:00"], 5: ["ok", "chat-vi", "Planning a picnic", "19:00"], 6: ["plan", "roots-vi", "Tiền tố RE-", "19:00"], 7: ["ok", "wordday-vi", "Word: cozy", "09:00"] };
const long = { 4: ["ok", "conversation", "The Office · tập 6", "20:00"], 7: ["plan", "conversation", "The Office · tập 7", "20:00"] };
const ep = (e) => e ? `<div class="ep ${e[0]}"><div class="thumb${e[1] === "conversation" ? " wide" : ""}" ${e[1] === "conversation" ? 'style="width:30px;aspect-ratio:1"' : ""}><img src="${S(e[1])}" alt=""></div><span>${e[2]}<small class="num">${e[3]}</small></span></div>` : "";
document.getElementById("lanes").innerHTML = `<div class="dh lab"></div>${days.map(([d, n, t]) => `<div class="dh${t ? " today" : ""}">${d}<b class="num">${n}</b></div>`).join("")}`
  + `<div class="lab row1">Short</div>${days.map(([, n]) => `<div class="row1">${ep(short[n])}</div>`).join("")}`
  + `<div class="lab">Video dài</div>${days.map(([, n]) => `<div>${ep(long[n])}</div>`).join("")}`;
document.getElementById("series").innerHTML = [["#1f8a4c", "Ngữ pháp bản chất", "Ngữ pháp · Short · mỗi 2 ngày", 3, 10], ["#0f766e", "Một gốc – cả họ từ", "Gốc từ · Short · mỗi ngày", 6, 20], ["#b45309", "The Office Startup", "Hội thoại · video dài · Thứ Tư và Thứ Bảy", 5, 12]]
  .map(([c, t, m, d, n]) => `<div class="row"><span class="dot" style="background:${c}"></span><div><div class="t">${t}</div><div class="m">${m}</div></div>
    <div><div class="m num" style="justify-content:space-between;margin:0 0 6px">${d}/${n} tập<span>${Math.round(d * 100 / n)}%</span></div><div class="bar"><i style="width:${d * 100 / n}%"></i></div></div><a class="btn sm" href="#">Mở</a></div>`).join("");
</script>
<script src="shell.js"></script></body></html>
