<!doctype html>

<title>Video của tôi — bản mẫu</title><link rel="stylesheet" href="../style.css"></head>
<body data-page="videos" data-crumbs="Video của tôi">
<main class="page">

    <div class="seg"><button aria-pressed="true"><svg class="i sm"><use href="../icons.svg#list"/></svg>Bảng</button><button><svg class="i sm"><use href="../icons.svg#grid"/></svg>Lưới</button></div></div>

  <div class="tabs">
    <a href="#" aria-current="page">Tất cả <small>48</small></a><a href="#">Chờ bạn <small>3</small></a><a href="#">Đang làm <small>2</small></a><a href="#">Đã lên lịch <small>5</small></a><a href="#">Đã đăng <small>38</small></a>

  </div>

  <section class="card" style="overflow:hidden">
    <table class="tbl">
      <thead><tr><th style="width:44%">Video</th><th>Trạng thái</th><th>Bước</th><th>SEO</th><th>Lịch / lượt xem</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
// prototype only
const V = [
  ["grammar-vi", "Câu bị động: hiểu bản chất", "Ngữ pháp · Short 0:58 · Ngữ pháp bản chất", "amber", "Chờ duyệt", "7/7", 86, "Thứ Tư 19:00"],
  ["roots-vi", "Hậu tố -MENT", "Gốc từ · Short 1:45", "red", "Thiếu hình", "5/7", 0, "—"],
  ["news-vi", "Cities plant more trees", "Tin tức · Short 0:57", "amber", "Chờ duyệt", "7/7", 81, "—"],
  ["mistakes-vi", "Lỗi \"I very like\"", "Đừng nói / Hãy nói · Short", "blue", "Đang dựng", "5/7", 0, "—"],
  ["roots-vi", "Gốc SPECT", "Gốc từ · Short 1:38 · Một gốc – cả họ từ", "green", "Đã lên lịch", "7/7", 92, "Hôm nay 19:00"],

  ["flashcards-vi", "10 từ về nhà bếp", "Flashcard · Short 0:44", "", "Đã đăng", "7/7", 84, "860 lượt xem"],

document.getElementById("rows").innerHTML = V.map(([img, t, s, tone, st, stp, seo, when]) => `<tr>
  <td><div class="row" style="gap:12px"><div class="thumb" style="width:34px"><img src="../../../../frontend/static/samples/${img}.jpg" alt=""></div><div><b style="font-weight:600">${t}</b><div class="muted" style="font-size:12.5px">${s}</div></div></div></td>
  <td><span class="badge ${tone}">${st}</span></td>
  <td class="mono muted">${stp}</td>
  <td>${seo ? `<span class="mono" style="font-weight:600;color:${seo >= 85 ? "var(--brand-600)" : "var(--amber-700)"}">${seo}</span>` : '<span class="muted">—</span>'}</td>
  <td class="muted" style="font-size:13px">${when}</td>
  <td style="text-align:right"><a class="btn sm ghost" href="${tone === "amber" ? "flow-7-youtube.html" : "flow-5-video.html"}">Mở</a></td></tr>`).join("");
</script>
<script src="../shell.js"></script></body></html>
