<body><div class="app">
<nav class="rail" aria-label="Điều hướng">

<script>

    <span class="tl chip ${tone || "dark"}">${label}</span>
    <div class="play"><span><svg class="i fill"><use href="../icons.svg#play"/></svg></span></div></div>
    <div class="name">${name}</div><div class="meta">${meta}</div></a>`).join("");
