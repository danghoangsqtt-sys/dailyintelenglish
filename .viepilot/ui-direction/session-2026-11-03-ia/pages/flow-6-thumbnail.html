<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bước 6 Ảnh bìa — bản mẫu</title><link rel="stylesheet" href="../style.css"></head>
<body data-page="videos" data-crumbs="Video của tôi|Câu bị động: hiểu bản chất" data-step="6" data-hint="Ảnh bìa Short hiện ở kênh và kết quả tìm kiếm">
<main class="page">
  <div class="split">
    <div class="gap">
      <section class="card">
        <div class="card-head"><h2>Kiểu ảnh bìa</h2><div class="end"><a class="btn sm" href="#"><svg class="i sm"><use href="../icons.svg#upload"/></svg>Tải ảnh lên</a></div></div>
        <div class="card-body"><div class="seg"><button aria-pressed="true">Khung hình trong video</button><button>Chữ lớn + nhân vật</button><button>Hình chủ đề</button></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Chọn một ảnh</h2><span class="sub">AI đề xuất 3 ảnh</span><div class="end"><a class="btn sm" href="#"><svg class="i sm"><use href="../icons.svg#refresh"/></svg>Làm thêm</a></div></div>
        <div class="card-body" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div class="opt" aria-pressed="true" style="max-width:220px"><img src="../../../../frontend/static/samples/grammar-vi.jpg" alt="" style="aspect-ratio:9/16"><span class="tick"><svg class="i sm"><use href="../icons.svg#check"/></svg></span><div>Bảng so sánh · 0:12</div></div>
          <div class="opt" style="max-width:220px"><img src="../../../../frontend/static/samples/presenter_short.jpg" alt="" style="aspect-ratio:9/16"><div>Chữ lớn + cô giáo</div></div>
          <div class="opt" style="max-width:220px"><img src="../../../../frontend/static/samples/mistakes-vi.jpg" alt="" style="aspect-ratio:9/16"><div>Lỗi hay gặp · 0:41</div></div>
        </div>
      </section>
    </div>
    <aside class="card" style="position:sticky;top:180px">
      <div class="card-head"><h2>Chỉnh ảnh đã chọn</h2></div>
      <div class="card-body form" style="gap:14px">
        <div class="field"><label>Dòng chữ lớn</label><input value="CÂU BỊ ĐỘNG"></div>
        <div class="field"><label>Dòng phụ</label><input value="hiểu trong 1 phút"></div>
        <div class="field"><div class="lbl">Màu nhấn</div><div class="row" style="gap:6px"><span style="width:28px;height:28px;border-radius:7px;background:#ffd60a;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand)"></span><span style="width:28px;height:28px;border-radius:7px;background:#17803d"></span><span style="width:28px;height:28px;border-radius:7px;background:#fff;border:1px solid var(--line)"></span></div></div>
        <div class="field"><div class="lbl">Hiện logo kênh</div><div class="seg"><button aria-pressed="true">Có</button><button>Không</button></div></div>
        <a class="btn block" href="#"><svg class="i"><use href="../icons.svg#upload"/></svg>Tải ảnh 1080×1920</a>
      </div>
    </aside>
  </div>
</main>
<script src="../shell.js"></script></body></html>
