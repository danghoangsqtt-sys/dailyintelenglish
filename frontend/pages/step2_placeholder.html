<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 2 — Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { margin: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--bg-elevated);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .placeholder-main {
      max-width: 560px;
      margin: 100px auto;
      padding: 40px;
      text-align: center;
    }

    .placeholder-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .placeholder-main h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
    }

    .placeholder-main p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 6px;
    }

    #project-id {
      font-family: monospace;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🎙️ Daily Intel English Studio</div>
    <button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button>
  </header>

  <main class="placeholder-main card">
    <div class="placeholder-icon">🚧</div>
    <h1>Step 2 — AI Script Generation</h1>
    <p>Coming in Task 1.4. Your project was created successfully.</p>
    <p>Project: <strong id="project-name"></strong></p>
    <p>ID: <span id="project-id"></span></p>
    <p style="margin-top: 24px;"><a href="/" class="btn btn-ghost">← Back to Dashboard</a></p>
  </main>

  <script src="/static/js/theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("project-id").textContent = params.get("project_id") || "(unknown)";
    document.getElementById("project-name").textContent = params.get("name") || "(untitled)";
  </script>
</body>
</html>
