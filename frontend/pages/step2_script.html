<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/brand/logo-64.png" type="image/png" />
  <title>Script — Daily Beyond English</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/js/i18n_vi.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <aside id="app-sidebar" class="app-sidebar" aria-label="App navigation"></aside>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <script src="/static/js/app_sidebar.js"></script>
  <header class="topbar">
    <button id="sidebar-open" class="sidebar-opener" type="button" aria-controls="app-sidebar" aria-expanded="false" aria-label="Open menu"><svg class="side-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span id="project-name" class="project-name">Loading…</span>
    <div class="actions">
      <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <div class="shell-flex">
    <div class="shell-row">
      <aside id="pane-sidebar" class="pane-sidebar" aria-label="Project workflow">
        <button id="sidebar-collapse-btn" type="button" class="btn btn-ghost sidebar-collapse-btn" aria-expanded="true">« Collapse</button>
        <div id="step-nav"></div>
        <div class="sidebar-label sidebar-summary card" style="margin-top:16px; padding:12px;"><strong>Script workspace</strong><p class="inspector-empty">Select a line to inspect language notes or synthesize a preview.</p></div>
      </aside>
      <div id="resizer-left" class="resizer-v" role="separator" aria-orientation="vertical" aria-label="Resize workflow sidebar" tabindex="0"></div>

      <main id="pane-main" class="pane-main">
        <section class="pane-stage" aria-label="Script stage">
          <div class="stage-header">
            <div><h1 class="stage-title">Script</h1><div id="project-badges" class="page-badges"></div></div>
            <div class="stage-actions"><span class="badge">Step 2 of 7</span></div>
          </div>
          <div id="error-banner" role="alert" hidden></div>
          <div id="ai-job-status" class="ai-job-status" aria-live="polite" hidden></div>
          <section id="generate-panel" class="card generate-panel" hidden><p>No script yet for this project. Generate one with AI.</p><button id="generate-btn" class="btn btn-primary">✨ Generate Script</button></section>
          <section id="editor-review" class="card editor-review" aria-live="polite" hidden></section>
          <div id="script-list"></div>
          <div id="script-actions" class="script-actions" hidden><button id="regenerate-all-btn" class="btn btn-ghost">🔁 Regenerate All</button><button id="next-step-btn" class="btn btn-primary">Next: Learning Content →</button></div>
        </section>

        <div id="resizer-top" class="resizer-h" role="separator" aria-orientation="horizontal" aria-label="Resize script timeline" tabindex="0"></div>
        <section id="pane-timeline" class="pane-timeline" aria-label="Script timeline">
          <div class="timeline-toolbar"><span>Timeline</span><span class="spacer"></span><span>Script navigation</span></div>
          <div class="track-row"><div class="track-label">📝 Script</div><div id="script-timeline" class="track-lane"></div></div>
          <div class="track-row"><div class="track-label">🔊 Voice</div><div class="track-lane"><span class="timeline-clip timeline-placeholder">Generated in TTS</span></div></div>
          <div class="track-row"><div class="track-label">🎵 Music</div><div class="track-lane"><span class="timeline-clip timeline-placeholder">Added in Audio</span></div></div>
        </section>
      </main>

      <div id="resizer-right" class="resizer-v" role="separator" aria-orientation="vertical" aria-label="Resize script inspector" tabindex="0"></div>
      <aside id="pane-inspector" class="pane-inspector" aria-label="Selected script line inspector"><div id="script-inspector" class="inspector-empty">Select a script line to inspect it.</div></aside>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/confirm_dialog.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/step_nav.js"></script>
  <script src="/static/js/step_guide.js"></script>
  <script src="/static/js/keyboard_shortcuts.js"></script>
  <script src="/static/js/save_indicator.js"></script>
  <script src="/static/js/ai_job.js"></script>
  <script src="/static/js/generation_status.js"></script>
  <script src="/static/js/shell.js"></script>
  <script src="/static/js/step2_script.js"></script>
</body>
</html>
