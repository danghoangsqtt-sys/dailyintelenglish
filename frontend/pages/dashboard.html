<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { margin: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--bg-elevated);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .hero {
      padding: 64px 40px 40px;
      text-align: center;
      background: radial-gradient(circle at 50% 0%, var(--accent-soft), transparent 60%);
    }

    .hero h1 {
      font-size: 34px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0 0 28px;
    }

    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--surface-border-hover);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-box {
      position: relative;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--surface-border-hover);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.6;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .project-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .project-card-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .project-card-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .project-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--surface-border);
    }

    .project-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .project-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🎙️ Daily Intel English Studio</div>
    <button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button>
  </header>

  <section class="hero">
    <h1>Tạo podcast tiếng Anh chuẩn với AI</h1>
    <p>Kịch bản chuẩn CEFR, giọng đọc tự nhiên, video và YouTube package — tất cả trong một pipeline.</p>
    <button id="new-project-btn" class="btn btn-primary">➕ Tạo Dự Án Mới</button>
  </section>

  <main class="main">
    <div class="toolbar">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="draft">Draft</button>
        <button class="filter-btn" data-filter="script_generated">In Progress</button>
        <button class="filter-btn" data-filter="complete">Complete</button>
      </div>
      <div class="search-box">
        <input id="search-input" type="text" placeholder="Search projects..." />
      </div>
    </div>

    <div id="project-grid" class="project-grid"></div>

    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">🎧</div>
      <p>No projects yet. Create your first AI-powered podcast episode.</p>
    </div>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
