<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Daily Intel English Studio dashboard"><span class="brand-mark" aria-hidden="true">D</span><span>Daily Intel English Studio</span></a>
    <div class="actions"><button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button></div>
  </header>

  <section class="dashboard-hero">
    <h1>Tạo podcast tiếng Anh chuẩn với AI</h1>
    <p>Kịch bản chuẩn CEFR, giọng đọc tự nhiên, video và YouTube package — tất cả trong một workspace.</p>
    <button id="new-project-btn" class="btn btn-primary large">➕ Tạo Dự Án Mới</button>
  </section>

  <main class="dashboard-main">
    <div class="toolbar">
      <div class="filter-bar" aria-label="Project status filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="draft">Draft</button>
        <button class="filter-btn" data-filter="script_generated">In Progress</button>
        <button class="filter-btn" data-filter="complete">Complete</button>
      </div>
      <label class="search-box"><span class="visually-hidden">Search projects</span><input id="search-input" type="search" placeholder="Search projects..." /></label>
    </div>

    <div id="error-banner" role="alert" hidden></div>
    <div id="project-grid" class="project-grid"></div>
    <div id="empty-state" class="empty-state" hidden><div class="empty-icon" aria-hidden="true">🎧</div><p>No projects yet. Create your first AI-powered podcast episode.</p></div>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
