<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/brand/logo-64.png" type="image/png" />
  <title>Videos — Daily Beyond English</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/studio.css" />
  <script src="/static/js/i18n_vi.js"></script>
  <script src="/static/js/i18n.js"></script>
</head>
<body>
  <aside id="app-sidebar" class="app-sidebar" aria-label="App navigation"></aside>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <script src="/static/js/app_sidebar.js"></script>
  <header class="topbar">
    <button id="sidebar-open" class="sidebar-opener" type="button" aria-controls="app-sidebar" aria-expanded="false" aria-label="Open menu"><svg class="side-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="actions">
      <button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <main class="e-page videos-page" id="videos">
    <!-- Phase 93 (Task 93.6, D142): every video in one place. The list keeps the former dashboard grid's IDs and script;
         "By step" is the production board that was on the dashboard. -->
    <div class="e-head"><h1>Videos</h1>
      <span class="e-end"><button id="new-project-btn" class="btn btn-primary" type="button">＋ New video</button></span></div>
    <div class="e-full e-tabs" role="tablist" aria-label="View">
      <button id="view-list" role="tab" aria-selected="true" aria-controls="videos-list">List</button>
      <button id="view-board" role="tab" aria-selected="false" aria-controls="videos-board">By step</button>
    </div>
    <section id="videos-list" class="e-full projects-card" role="tabpanel" aria-labelledby="view-list">
      <div class="toolbar videos-tools">
        <div class="filter-bar e-chips" aria-label="Project status filters">
          <button class="filter-btn e-chip active" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-btn e-chip" data-filter="draft" aria-pressed="false">Draft</button>
          <button class="filter-btn e-chip" data-filter="script_generated" aria-pressed="false">In Progress</button>
          <button class="filter-btn e-chip" data-filter="complete" aria-pressed="false">Complete</button>
        </div>
        <label class="search-box"><span class="visually-hidden">Search projects</span><input id="search-input" type="search" placeholder="Search projects..." /></label>
      </div>
    <div id="error-banner" role="alert" hidden></div>
    <div id="project-grid" class="project-grid"></div>
    <nav id="project-pagination" class="dashboard-pagination" aria-label="Project pages" hidden>
      <button id="previous-page-btn" class="btn btn-ghost" type="button">← Previous</button>
      <span id="page-indicator" class="dashboard-page-indicator" aria-live="polite"></span>
      <button id="next-page-btn" class="btn btn-ghost" type="button">Next →</button>
    </nav>
    <div id="empty-state" class="empty-state" hidden><div class="empty-icon" aria-hidden="true">🎧</div><p>No projects yet. Create your first AI-powered podcast episode.</p></div>
    </section>
    <section id="videos-board" class="e-full" role="tabpanel" aria-labelledby="view-board" hidden>
      <div id="production-board" class="production-board"></div>
      <section class="studio-card cockpit-card videos-roadmap" aria-labelledby="roadmap-title">
        <header><h2 id="roadmap-title">Channel roadmap</h2></header>
        <ol id="roadmap-steps" class="roadmap-steps"></ol>
        <div id="roadmap-detail" class="roadmap-detail"></div>
      </section>
    </section>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/confirm_dialog.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/dashboard_channel.js?v=20261104-videos"></script>
  <script src="/static/js/videos_tabs.js"></script>
</body>
</html>
