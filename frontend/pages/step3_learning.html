<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Content — Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* --- Tabs --- */

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-btn {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tab-panel[hidden] {
      display: none;
    }

    /* --- Item cards --- */

    .item-card {
      padding: 18px 20px;
      cursor: pointer;
    }

    .item-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .item-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .item-title {
      font-size: 16px;
      font-weight: 700;
      cursor: text;
      padding: 2px 6px;
      margin: 0 -6px;
      border-radius: 6px;
    }

    .item-title:hover,
    .field:hover {
      background: var(--surface-2);
    }

    .field {
      cursor: text;
      padding: 2px 6px;
      margin: 0 -6px;
      border-radius: 6px;
      outline: none;
      transition: background 0.15s ease;
    }

    .field:focus {
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .field-row {
      font-size: 14px;
      line-height: 1.5;
      margin-top: 4px;
      color: var(--text);
    }

    .field-row .field-label {
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .ipa {
      font-family: "Courier New", monospace;
      color: var(--info);
    }

    .example-sentence {
      font-style: italic;
      color: var(--muted);
    }

    .examples-list {
      margin: 6px 0 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .options-list {
      margin: 10px 0 0;
      padding-left: 20px;
      font-size: 14px;
    }

    .options-list li.correct {
      color: var(--success);
      font-weight: 700;
    }

    .quiz-answer {
      margin-top: 12px;
      padding: 12px 14px;
      background: var(--surface-2);
      border-radius: 8px;
      font-size: 14px;
    }

    .quiz-answer[hidden] {
      display: none;
    }

    .content-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Return to dashboard"><span class="brand-mark" aria-hidden="true">D</span><span>Daily Intel English Studio</span></a>
    <span id="project-name" class="project-name">Loading…</span>
    <div class="actions">
      <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <a href="/" class="btn btn-ghost btn-sm">← Dashboard</a>
      <button id="theme-toggle" class="icon-toggle" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <div class="shell-flex">
    <div class="shell-row">
      <aside id="pane-sidebar" class="pane-sidebar" aria-label="Project workflow">
        <button id="sidebar-collapse-btn" type="button" class="btn btn-ghost sidebar-collapse-btn" aria-expanded="true">« Collapse</button>
        <div id="step-nav"></div>
        <div class="sidebar-label sidebar-summary card" style="margin-top:16px; padding:12px;"><strong>Learning workspace</strong><p class="inspector-empty">Select an item to see its full detail.</p></div>
      </aside>
      <div id="resizer-left" class="resizer-v" role="separator" aria-orientation="vertical" aria-label="Resize workflow sidebar" tabindex="0"></div>

      <main id="pane-main" class="pane-main">
        <section class="pane-stage" aria-label="Learning content stage">
          <div class="stage-header">
            <div><h1 class="stage-title">Learning</h1><div id="project-badges" class="page-badges"></div></div>
            <div class="stage-actions"><span class="badge">Step 3 of 7</span></div>
          </div>

          <div id="error-banner" hidden></div>

          <section id="generate-panel" class="card generate-panel" hidden>
            <p>No learning content yet for this project. Generate a pack with AI from the script.</p>
            <button id="generate-btn" class="btn btn-primary">✨ Generate Learning Pack</button>
          </section>

          <div id="content-wrap" hidden>
            <div class="tabs" id="content-tabs">
              <button class="tab-btn active" data-tab="vocabulary">📚 Vocabulary</button>
              <button class="tab-btn" data-tab="idioms">💬 Idioms</button>
              <button class="tab-btn" data-tab="grammar">🔍 Grammar</button>
              <button class="tab-btn" data-tab="quiz">❓ Quiz</button>
            </div>

            <section class="tab-panel" id="vocabulary-panel" data-tab-panel="vocabulary"></section>
            <section class="tab-panel" id="idioms-panel" data-tab-panel="idioms" hidden></section>
            <section class="tab-panel" id="grammar-panel" data-tab-panel="grammar" hidden></section>
            <section class="tab-panel" id="quiz-panel" data-tab-panel="quiz" hidden></section>

            <div class="content-actions">
              <button id="regenerate-btn" class="btn btn-ghost">🔄 Regenerate Pack</button>
              <button id="next-step-btn" class="btn btn-primary">Next: TTS Audio Studio →</button>
            </div>
          </div>
        </section>
      </main>

      <div id="resizer-right" class="resizer-v" role="separator" aria-orientation="vertical" aria-label="Resize learning inspector" tabindex="0"></div>
      <aside id="pane-inspector" class="pane-inspector" aria-label="Selected item inspector"><div id="learning-inspector" class="inspector-empty">Select an item to inspect it.</div></aside>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/step_nav.js"></script>
  <script src="/static/js/keyboard_shortcuts.js"></script>
  <script src="/static/js/save_indicator.js"></script>
  <script src="/static/js/shell.js"></script>
  <script src="/static/js/step3_learning.js"></script>
</body>
</html>
