<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { margin: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--bg-elevated);
    }

    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 20px; font-weight: 800; text-decoration: none; }

    .main {
      width: min(640px, calc(100% - 80px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .page-heading { margin-bottom: 28px; }
    .page-heading h1 { margin: 0 0 10px; font-size: 32px; }
    .page-heading p { margin: 0; color: var(--text-muted); line-height: 1.6; }

    .settings-card { padding: 24px; }
    .settings-card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .settings-card .section-hint { margin: 0 0 18px; font-size: 13px; color: var(--text-muted); }

    .current-status {
      margin: 14px 0 4px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      background: var(--surface-2);
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🎙️ Daily Intel English Studio</a>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="/">← Dashboard</a>
      <button id="theme-toggle" class="icon-toggle" type="button" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <main class="main">
    <section class="page-heading">
      <h1>Settings</h1>
      <p>Daily Intel English Studio runs entirely on your local Ollama model — no cloud API key needed.</p>
    </section>

    <section class="card settings-card">
      <h2>AI Provider</h2>
      <p class="section-hint">
        Script, learning content, thumbnail, and YouTube package generation all run
        locally via Ollama — no cloud fallback.
      </p>

      <div id="ai-mode-status" class="current-status" aria-live="polite">Loading…</div>
    </section>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/settings.js"></script>
</body>
</html>
