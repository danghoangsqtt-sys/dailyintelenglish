<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Daily Intel English Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { margin: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--bg-elevated);
    }

    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 20px; font-weight: 800; text-decoration: none; }

    .main {
      width: min(640px, calc(100% - 80px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .page-heading { margin-bottom: 28px; }
    .page-heading h1 { margin: 0 0 10px; font-size: 32px; }
    .page-heading p { margin: 0; color: var(--text-muted); line-height: 1.6; }

    .settings-card { padding: 24px; }
    .settings-card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .settings-card .section-hint { margin: 0 0 18px; font-size: 13px; color: var(--text-muted); }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .key-input-row { display: flex; gap: 8px; }

    input[type="password"],
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
    }

    input:focus {
      outline: none;
      border-color: var(--surface-border-hover);
    }

    .current-status {
      margin: 14px 0 20px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      background: var(--surface-2);
      color: var(--text-2);
    }

    .form-actions { display: flex; gap: 10px; margin-top: 18px; }

    .message {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
    }

    .message-success { color: var(--success); background: rgba(63, 185, 80, 0.1); }
    .message-error { color: var(--danger); background: rgba(248, 81, 73, 0.1); }
    .message[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🎙️ Daily Intel English Studio</a>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="/">← Dashboard</a>
      <button id="theme-toggle" class="icon-toggle" type="button" aria-label="Toggle dark/light mode">☀️</button>
    </div>
  </header>

  <main class="main">
    <section class="page-heading">
      <h1>Settings</h1>
      <p>Configure the Gemini API key used for script, learning content, thumbnail, and YouTube package generation.</p>
    </section>

    <section class="card settings-card">
      <h2>Gemini API Key</h2>
      <p class="section-hint">Saved here takes effect immediately — no restart needed. Stored keys always take priority over the <code>.env</code> file.</p>

      <div id="current-status" class="current-status" aria-live="polite">Loading…</div>

      <label class="field-label" for="api-key-input">API Key</label>
      <div class="key-input-row">
        <input type="password" id="api-key-input" placeholder="Enter your Gemini API key" autocomplete="off" />
        <button id="toggle-visibility-btn" type="button" class="icon-toggle" aria-label="Show/hide API key">👁️</button>
      </div>

      <div class="form-actions">
        <button id="save-btn" type="button" class="btn btn-primary">Save</button>
        <button id="clear-btn" type="button" class="btn btn-ghost">Clear stored key</button>
      </div>

      <div id="message" class="message" hidden></div>
    </section>
  </main>

  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/settings.js"></script>
</body>
</html>
